<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entity overview on a phone — LexReg</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/f3cded53e7fed4f078920ca82a469759">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; overflow-x: hidden; overflow-y: auto; background: var(--bg)">
  <dc-import name="Workspace" dark="{{dark}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { dark: !!this.props.dark, theme: this.props.dark ? 'lx-dark' : '' };
}
}
</script>
</body>
</html>
